300 46 C210.44 46.26, 121.94 47.07, 0 46 M0 46 C-2.02 33.29, -1.52 16.94, 0 0 M0 46 C-1.02 34.56, -0.22 21.36, 0 0" stroke="#1e1e1e" stroke-width="2" fill="none"></path></g><g transform="translate(73 318.375) rotate(0 107.52489471435547 10.625)"><text x="0" y="14.875" font-family="Comic Shanns, Segoe UI Emoji" font-size="17px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic"> sumTo(3)  waits: 3 + ?</text></g><g stroke-linecap="round" transform="translate(68 360) rotate(0 150 23)"><path d="M0.96 -0.67 L300.2 -0.46 L300.96 44.37 L-1.89 45.64" stroke="none" stroke-width="0" fill="#e9ecef"></path><path d="M0 0 C88.58 2.08, 173.8 0.78, 300 0 M0 0 C100.25 -1.6, 200.14 -1.75, 300 0 M300 0 C298.71 16.03, 298.66 32.26, 300 46 M300 0 C300.67 13.19, 299.75 25.93, 300 46 M300 46 C222.08 47.51, 147.91 47.38, 0 46 M300 46 C182.02 44, 65.51 44.29, 0 46 M0 46 C1.6 29.52, -0.16 15.18, 0 0 M0 46 C0.61 28.77, -0.28 10.65, 0 0" stroke="#1e1e1e" stroke-width="2" fill="none"></path></g><g transform="translate(73 372.375) rotate(0 135.57485961914062 10.625)"><text x="0" y="14.875" font-family="Comic Shanns, Segoe UI Emoji" font-size="17px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic"> main      waits for sumTo(3)</text></g><g transform="translate(388 156) rotate(0 65.99990844726562 10)"><text x="0" y="14" font-family="Comic Shanns, Segoe UI Emoji" font-size="16px" fill="#2f9e44" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">&lt;- top: running</text></g><g transform="translate(388 372) rotate(0 39.599945068359375 10)"><text x="0" y="14" font-family="Comic Shanns, Segoe UI Emoji" font-size="16px" fill="#868e96" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">&lt;- bottom</text></g><g transform="translate(68 434) rotate(0 241.99966430664062 10)"><text x="0" y="14" font-family="Comic Shanns, Segoe UI Emoji" font-size="16px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">then they pop: sumTo(1) = 1, sumTo(2) = 3, sumTo(3) = 6</text></g><g transform="translate(68 464) rotate(0 281.599609375 10)"><text x="0" y="14" font-family="Comic Shanns, Segoe UI Emoji" font-size="16px" fill="#1971c2" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">memory used = the deepest the stack gets: n + 1 frames  -&gt;  O(n)</text></g></svg>