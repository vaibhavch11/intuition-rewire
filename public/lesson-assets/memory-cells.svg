<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260" font-family="Inter, system-ui, sans-serif">
  <rect width="900" height="260" fill="none" />

  <text x="450" y="34" font-size="15" fill="#464555" text-anchor="middle">RAM — one numbered slot per byte</text>

  <g stroke="#131b2e" stroke-width="2" fill="#ffffff">
    <rect x="90" y="70" width="90" height="70" rx="3" />
    <rect x="180" y="70" width="90" height="70" rx="3" />
    <rect x="270" y="70" width="90" height="70" rx="3" />
    <rect x="360" y="70" width="90" height="70" rx="3" />
    <rect x="450" y="70" width="90" height="70" rx="3" />
    <rect x="540" y="70" width="90" height="70" rx="3" />
    <rect x="630" y="70" width="90" height="70" rx="3" />
    <rect x="720" y="70" width="90" height="70" rx="3" />
  </g>

  <rect x="360" y="70" width="90" height="70" rx="3" fill="#eef0ff" stroke="#4f46e5" stroke-width="2.5" />

  <g font-size="20" fill="#131b2e" text-anchor="middle">
    <text x="135" y="113">—</text>
    <text x="225" y="113">—</text>
    <text x="315" y="113">—</text>
    <text x="405" y="113" fill="#3525cd">16</text>
    <text x="495" y="113">—</text>
    <text x="585" y="113">—</text>
    <text x="675" y="113">—</text>
    <text x="765" y="113">—</text>
  </g>

  <g font-size="13" fill="#777587" text-anchor="middle">
    <text x="135" y="163">1000</text>
    <text x="225" y="163">1001</text>
    <text x="315" y="163">1002</text>
    <text x="405" y="163" fill="#3525cd">1003</text>
    <text x="495" y="163">1004</text>
    <text x="585" y="163">1005</text>
    <text x="675" y="163">1006</text>
    <text x="765" y="163">1007</text>
  </g>

  <text x="450" y="200" font-size="13" fill="#464555" text-anchor="middle">address</text>

  <line x1="405" y1="215" x2="405" y2="172" stroke="#4f46e5" stroke-width="2" />
  <polygon points="405,164 399,178 411,178" fill="#4f46e5" />
  <text x="405" y="238" font-size="14" fill="#3525cd" text-anchor="middle">the result is stored at address 1003</text>
</svg>
